<svg xmlns="http://www.w3.org/2000/svg" width="56" height="80" viewBox="0 0 56 80">
  <!-- Temporary P004 placeholder thief: hunched, hooded, dark purple with bright eyes and an empty sack.
       Chosen to read differently from the King (no crown, no gold body). Not art direction. -->
  <g stroke="#120a16" stroke-width="3" stroke-linejoin="round">
    <!-- empty sack (trailing side) -->
    <path d="M6 44 Q2 58 10 64 Q20 66 20 54 Q18 44 12 42 Z" fill="#8a7a5c"/>
    <!-- feet -->
    <rect x="18" y="70" width="9" height="7" rx="2" fill="#2a2030"/>
    <rect x="31" y="70" width="10" height="7" rx="2" fill="#2a2030"/>
    <!-- cloak body -->
    <path d="M16 34 Q12 56 16 72 L44 72 Q48 54 42 34 Z" fill="#4b2e5e"/>
    <!-- grabbing arm -->
    <path d="M40 44 L52 50 L49 55 L38 50 Z" fill="#4b2e5e"/>
    <!-- hood -->
    <path d="M14 34 Q14 10 30 8 Q46 10 46 34 Q30 40 14 34 Z" fill="#3a2149"/>
    <!-- shadowed face -->
    <ellipse cx="33" cy="26" rx="10" ry="8" fill="#170d1d"/>
  </g>
  <!-- eyes -->
  <circle cx="30" cy="25" r="2.4" fill="#ffe14d"/>
  <circle cx="38" cy="25" r="2.4" fill="#ffe14d"/>
</svg>
